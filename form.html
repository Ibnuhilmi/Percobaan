<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Form</title>
</head>
<body>

    <form action="">
        Nama : <input type="text" placeholder="Isi dengan Nama Lengkap Anda" cols="10" rows="5">
        <br>
        <br>
        Kelas : <input type="number">
        <br>
        <br>
        Id : <input type="password">
        <br>
        <br>
        Pilihan Belajar :
        <select name="Pilihan" id="pilihan">
            <option value="HTML">Belajar HTML</option>
            <option value="CSS">Belajar CSS</option>
            <option value="JV">Belajar JavaScript</option>
        </select>
        <br>
        <br>
        Rangkaian Belajar : <textarea name="Rangkaian" id="rangkaian" cols="40" rows="20"></textarea>
        <br>
        <br>

        Metode Belajar :
        <br>
        <input type="radio" value="Membaca" checked="checked">Membaca <br>
        <input type="radio" value="Menulis">Menulis <br>
        <input type="radio" value="praktik">Praktik <br>
        <br>

        Hasil Praktik : <br>
        <input type="checkbox" checked="checked">Membuat Website <br>
        <input type="checkbox">Membuat Aplikasi <br>
        <input type="checkbox">Membuat Buku <br>
        <br>

        <button type="submit">
            Kirim Jawaban
        </button>
    </form>
    
</body>
</html>
